services:
  # Frontend Static Site (Deploys only frontend on Render - Fast, Free, No backend errors)
  - type: web
    name: employee-management-system-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
